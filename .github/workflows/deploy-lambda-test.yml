name: Deploy Lambda Test

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Force GitHub Actions to use Python 3.10 (matching AWS Lambda)
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies & Package
        run: |
          cd Test-Scripts/lambda-API
          
          rm -rf package_root
          mkdir -p package_root
          
          # Now pip will correctly install exceptiongroup for Python 3.10
          pip install --no-cache-dir -r requirements.txt -t package_root/
          
          cp app.py package_root/
          
          cd package_root
          zip -r ../../../deployment.zip .
          cd ../../..

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change to your AWS region if different

      - name: Update Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name Test_function_1 \
            --zip-file fileb://deployment.zip