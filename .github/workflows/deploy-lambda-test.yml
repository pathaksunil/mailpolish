name: Deploy Lambda Test

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Force GitHub Actions to use Python 3.10 (matching AWS Lambda)
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies & Package
        run: |
          cd Test-Scripts/lambda-API
          
          # Remove any old zip package
          rm -f ../../deployment.zip
          
          # Install dependencies locally into this folder so they are included
          pip install --no-cache-dir -r requirements.txt -t .
          
          # Zip everything in this folder directly into the root of the repo
          zip -r ../../deployment.zip .
          
          cd ../../..

      # 👇 ADD THIS STEP TO CHECK THE ZIP STRUCTURE IN LOGS 👇
      - name: Verify Zip Contents
        run: |
          echo "=== Contents of deployment.zip ==="
          unzip -l deployment.zip
          echo "=================================="


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change to your AWS region if different

      - name: Update Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name Test_function_1 \
            --zip-file fileb://deployment.zip