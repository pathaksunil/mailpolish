name: Deploy Lambda Test

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Force GitHub Actions to use Python 3.10 (matching AWS Lambda)
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies & Package
        run: |
          # Create a clean isolated staging folder at the root
          mkdir -p lambda_build
          
          # Install dependencies into the staging folder using Python 3.10
          pip install --no-cache-dir -r Test-Scripts/lambda-API/requirements.txt -t lambda_build/
          
          # Copy app.py explicitly into the root of the staging folder
          cp Test-Scripts/lambda-API/app.py lambda_build/
          
          # Remove any old zip
          rm -f deployment.zip
          
          # Zip the contents of the staging folder so everything sits cleanly at the root
          cd lambda_build
          zip -r ../deployment.zip .
          cd ..

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change to your AWS region if different

      - name: Update Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name Test_function_1 \
            --zip-file fileb://deployment.zip